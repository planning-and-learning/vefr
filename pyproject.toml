[build-system]
requires = [
    "scikit-build-core>=1.0.3,<2",
    "nanobind-backend>=1.0",
    "pyurd>=0.2.0,<0.3",
    "pybrokkr>=0.1.3,<0.2",
]
build-backend = "pyvefr_build_backend"
backend-path = ["python"]

[project]
name = "pyvefr"
version = "0.1.0"
description = "Graph algorithms over urd's graphs: color refinement, Weisfeiler-Leman, nauty, searches and shortest paths"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Dominik Drexler", email = "dominik.drexler@liu.se"},
]
dependencies = [
    "nanobind-backend>=1.0",
    "pyurd>=0.2.0,<0.3",
    "pybrokkr>=0.1.3,<0.2",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/planning-and-learning/vefr"

# The documentation (docs/*.rst) wraps at 120 columns.
[tool.doc8]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.scikit-build]
build.targets = ["pyvefr_wheel"]
cmake.build-type = "Release"
install.components = ["pyvefr"]
wheel.packages = []
wheel.py-api = "cp311"

[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "Config.cmake.in",
    "README.md",
    "pyproject.toml",
    "include/**",
    "python/**",
    "src/**",
    "tests/**",
]
exclude = [
    "build*/**",
    "*.egg-info/**",
]

[tool.scikit-build.cmake.define]
VEFR_BUILD_PYVEFR = true
VEFR_BUILD_TESTS = false
CMAKE_INSTALL_LIBDIR = "lib"

[tool.cibuildwheel]
build = "cp311-*"
container-engine = "docker"
build-frontend = { name = "build", args = ["--no-isolation"] }
before-build = "n=0; until python -m pip install --no-cache-dir 'scikit-build-core>=1.0.3,<2' 'cmake>=3.21' 'ninja>=1.5' 'nanobind-backend>=1.0' 'pyurd>=0.2.0,<0.3' 'pybrokkr>=0.1.3,<0.2'; do n=$((n+1)); [ $n -ge 30 ] && exit 1; echo 'provider wheels not on the index yet; retrying in 60s'; sleep 60; done"

[tool.cibuildwheel.linux]
repair-wheel-command = "python -m pyurd.repair --providers pyurd_native --dest-dir {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "python -m pyurd.repair --providers pyurd_native --require-archs {delocate_archs} --dest-dir {dest_dir} {wheel}"
